<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #07080c;
            --panel: rgba(16, 24, 39, 0.72);
            --line: rgba(255, 255, 255, 0.12);
            --text: #f8fafc;
            --muted: #a8b3c7;
            --accent: #ffb703;
            --accent-2: #00d4ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 15% 20%, rgba(0, 212, 255, 0.2), transparent 28rem),
                radial-gradient(circle at 85% 10%, rgba(255, 183, 3, 0.18), transparent 26rem),
                linear-gradient(135deg, #07080c 0%, #111827 46%, #161616 100%);
            color: var(--text);
        }

        .shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            align-items: center;
            padding: 40px 20px;
            overflow: hidden;
        }

        .hero {
            width: min(1040px, 100%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
            gap: 42px;
            align-items: center;
        }

        .copy {
            padding: 14px 0;
        }

        .eyebrow {
            margin: 0 0 16px;
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 760px;
            margin: 0;
            font-size: clamp(3rem, 7vw, 6.6rem);
            line-height: 0.9;
            letter-spacing: 0;
        }

        .lead {
            max-width: 620px;
            margin: 24px 0 34px;
            color: var(--muted);
            font-size: clamp(1rem, 2vw, 1.18rem);
            line-height: 1.7;
        }

        form {
            display: flex;
            gap: 12px;
            max-width: 720px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(7, 8, 12, 0.72);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
            backdrop-filter: blur(20px);
        }

        input {
            width: 100%;
            min-height: 54px;
            border: 0;
            border-radius: 6px;
            font: inherit;
        }

        input[type="text"] {
            padding: 0 18px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            outline: 1px solid transparent;
        }

        input[type="text"]:focus {
            outline-color: rgba(0, 212, 255, 0.7);
        }

        input[type="submit"] {
            max-width: 160px;
            padding: 0 22px;
            background: var(--accent);
            color: #111827;
            font-weight: 800;
            cursor: pointer;
        }

        .poster-wall {
            position: relative;
            min-height: 560px;
            display: grid;
            grid-template-columns: repeat(2, minmax(120px, 1fr));
            gap: 16px;
            transform: rotate(-4deg);
        }

        .tile {
            min-height: 250px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background:
                linear-gradient(160deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.02)),
                linear-gradient(135deg, #1f2937, #0f172a);
            box-shadow: 0 26px 70px rgba(0, 0, 0, 0.36);
        }

        .tile:nth-child(2) {
            margin-top: 44px;
            background:
                linear-gradient(160deg, rgba(255, 183, 3, 0.36), rgba(255, 255, 255, 0.04)),
                #172033;
        }

        .tile:nth-child(3) {
            margin-top: -34px;
            background:
                linear-gradient(160deg, rgba(0, 212, 255, 0.32), rgba(255, 255, 255, 0.04)),
                #151515;
        }

        .tile:nth-child(4) {
            background:
                linear-gradient(160deg, rgba(248, 250, 252, 0.22), rgba(255, 255, 255, 0.03)),
                #2a1d17;
        }

        @media (max-width: 820px) {
            .hero {
                grid-template-columns: 1fr;
            }

            .poster-wall {
                min-height: 240px;
                grid-template-columns: repeat(4, 1fr);
                order: -1;
            }

            .tile {
                min-height: 170px;
            }

            form {
                flex-direction: column;
            }

            input[type="submit"] {
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="hero">
            <div class="copy">
                <p class="eyebrow">Movie intelligence</p>
                <h1>CineMatch</h1>
                <p class="lead">Pick a movie you already love and get a sharper set of recommendations with posters, ratings, release years, and quick story context.</p>

                <form action="/recommend" method="post">
                    <input type="text" name="movie" list="movie_list" placeholder="Search a movie, e.g. Avatar" required>

                    <datalist id="movie_list">
                        {% for movie in movies %}
                        <option value="{{ movie }}"></option>
                        {% endfor %}
                    </datalist>
                    <input type="submit" value="Recommend">
                </form>
            </div>

            <div class="poster-wall" aria-hidden="true">
                <div class="tile"></div>
                <div class="tile"></div>
                <div class="tile"></div>
                <div class="tile"></div>
            </div>
        </section>
    </main>
</body>
</html>
